apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
  labels: {app: btc-forecast}
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secret
  labels: {app: btc-forecast}
type: Opaque
stringData:            # placeholders only - never commit real credentials
  RELOAD_TOKEN: "change-me-reload-token"
  DATA_API_KEY: "change-me-api-key"
