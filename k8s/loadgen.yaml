# In-cluster load generator for the HPA demo. Delete after the demo:
#   kubectl delete -f k8s/loadgen.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 3
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - while true; do wget -q -O /dev/null --post-data '{}' http://btc-forecast-clusterip/predict; done
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: 200m, memory: 32Mi}
