apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-clusterip
  labels: {app: btc-forecast}
spec:
  type: ClusterIP
  selector: {app: btc-forecast}
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-nodeport
  labels: {app: btc-forecast}
spec:
  type: NodePort
  selector: {app: btc-forecast}
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
